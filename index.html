<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El Pollo Loco</title>
    
    <link rel="icon" type="image/x-icon" href="img/6_salsa_bottle/bottle_rotation/1_bottle_rotation.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="rotateDeviceScreen">
    <div class="rotateIcon">↺</div>
    <h2>please turn the device</h2>
    <p>Hold your smartphone sideways to play the game.</p>
</div>

<div id="startScreen">
    <img src="img/9_intro_outro_screens/start/startscreen_1.png" alt="start screen">
    <button id="startGame">Start</button>
    <button id="openControls" >Controls</button>
    <button onclick="toggleFullscreen()" class="toggleFullscreen-btn">[ ]</button>
</div>
<div id="controlsDialog" class="dialogOverlay">
    <div class="controlsDialog">
        <button id="closeControls" class="closeDialog">X</button>

        <h2>Controls</h2>

        <div class="controlsRow">
        <span>⇨</span>
        <span>Right</span>
        </div>
        <div class="controlsRow">
        <span>⇦</span>
        <span>Left</span>
        </div>
        <div class="controlsRow">
        <span>Space</span>
        <span>Jump</span>
        </div>
        <div class="controlsRow">
        <span>C</span>
        <span>Throw</span>
        </div>
    </div>
</div>

<h1>El Pollo loco</h1>

    <div id="gameContainer">
            <canvas id="canvas" width="720" height="480"></canvas>
        <div id="mobileControls">
            <div class="mobileControlsLeft">
                <button id="mobileLeft" class="mobileButton">⇐</button>
                <button id="mobileRight" class="mobileButton">⇒</button>
            </div>
            <div class="mobileControlsRight">
                <button id="mobileJump" class="mobileButton">J</button>
                <button id="mobileThrow" class="mobileButton">T</button>
            </div>
        </div>
        <div id="YouLoseScreen" style="display: none;">
            <img src="img/You won, you lost/You lost.png" alt="">
            <button class="HomeBtn" id="homeScreen">Home</button>
            <button id="resetGame" class="resetBtn">Restart</button>
        </div>
        <div id="YouWonScreen" style="display: none;">
            <img src="img/You won, you lost/You won A.png" alt="">
            <button class="HomeBtn" id="homeScreenWon">Home</button>
            <button id="resetGameWon" class="resetBtn">Restart</button>
        </div>
    </div>
    
    <button id="openImprint" class="imprintLink">Imprint</button>
    <div id="imprintDialog"  class="imprintOverlay">
        <div class="imprintDialog">
            <button id="closeImprint" class="closeImprintBtn">X</button>
            <h2>Imprint</h2>
            <p> Salih Derin<br>
                Kastanienallee 28<br>
                30519 Hannover
            </p>
            <p>
                Email: <a href="malito:Derin.salih@gmx.de">Derin.salih@gmx.de</a>
            </p>
        </div>
    </div>

    <script type="module" src="game.js"></script>
</body>
</html>
